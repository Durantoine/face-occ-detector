name: convnextv2-base-3090-v19
description: |
  ConvNeXt v2 Base (~88M params, native 224×224) — v19. Mirrors the
  efficientnet-b0-3090-v19 template (full pool search) with ConvNeXt-specific
  overrides driven by the v4 30h sweep (34 trials) and the partial v17 run
  (5 trials before a DDP deadlock killed the sweep).

  Key choices:
    - batch_size 32 (B0 used 192 — ConvNeXt-Base needs more VRAM per sample)
    - bf16 (aligned with v19 homogenisation; LayerNorm/GRN tolerate it)
    - layer_decay active (well-defined on ConvNeXt 4 stages; v4 ≈ 0.7, v17 ≈ 0.9
      with tri-split → range [0.65, 1.0] covers both regimes)
    - feature_fairness restricted to [none, dann]: ot triggered a DDP deadlock
      on run 838695 trial 6 in v17. v4 + v17 winners use none and dann.
    - pooling_type search_space INCLUDES `gap`: when Optuna picks gap on
      ConvNeXt, _build_backbone uses timm's native classifier head
      (num_classes=0, default global_pool="avg") so the LayerNorm + GAP +
      drop applied is exactly the one the pretrained checkpoint was fine-tuned
      with. Other pool types (attention_k_query/mil/grid) keep the spatial
      output (global_pool="") to attend over the (B, 49, 1024) feature map.

model:
  model_name: convnextv2_base.fcmae_ft_in22k_in1k
  output_dim: 1
  head_dropout: 0.1
  projection_size: null
  output_activation: sigmoid
  pooling_type: gap                # default; Optuna sweeps over all 4 choices
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  mil_agg: multi
  mil_hidden: 128
  mil_k_top: 30
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null
  val_split_ratio: 0.15
  test_split_ratio: 0.05

training:
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  num_train_epochs: 13
  learning_rate: 4.0e-05
  weight_decay: 0.10
  warmup_ratio: 0.1
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.3
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 25
  metric_for_best_model: eval_challenge_score
  greater_is_better: false
  bf16: true
  fp16: false
  gradient_checkpointing: false
  augmentation_level: light
  layer_decay: 0.85
  loss_lambda_init: 1.0
  loss_lambda_lr: 0.2
  loss_lambda_max: 3.0
  loss_lambda_min: 1.0
  loss_lambda_threshold: 0.0005
  adv_lambda: 0.01
  ot_lambda: 0.1
  save_qualitative_k: 10

optuna:
  n_trials: 80
  objective_mode: score
  rotate_val_seed: false
  keep_top_n: 3
  search_space:
    # Full pool search: gap (= native ConvNeXt head, the pretrained alignment),
    # attention_k_query / mil / grid (operate on the spatial (B, 49, 1024) map).
    pooling_type:
      type: categorical
      choices: [gap, attention_k_query, mil, grid]

    correction_strength: {type: float, low: 0.4, high: 1.0}

    # ot excluded — DDP deadlock on convnext run 838695 trial 6.
    feature_fairness:
      type: categorical
      choices: [none, dann]
    adv_lambda:
      type: float
      low: 0.005
      high: 0.20
      log: true
      conditional_on:
        feature_fairness: dann

    loss_focal_gamma: {type: float, low: 0.5, high: 2.0}

    # ConvNeXt-Base ranges (v4 + v17 lessons):
    # - LR around v4 optimum 3-4e-5
    # - layer_decay reinstated on ConvNeXt's 4-stage hierarchy
    learning_rate:           {type: float, low: 1.5e-05, high: 1.0e-04, log: true}
    min_lr_rate:             {type: float, low: 0.2, high: 0.4}
    weight_decay:            {type: float, low: 0.03, high: 0.40}
    head_dropout:            {type: float, low: 0.0, high: 0.3}
    layer_decay:             {type: float, low: 0.65, high: 1.0}
    backbone_drop_path_rate: {type: float, low: 0.0, high: 0.2}
    num_train_epochs:        {type: int,   low: 10,  high: 15}
    warmup_ratio:            {type: float, low: 0.05, high: 0.15}

    augmentation_level:
      type: categorical
      choices: [none, light, medium]

    # === Conditional on pooling_type == attention_k_query ===
    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.15
      conditional_on:
        pooling_type: attention_k_query
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.15
      conditional_on:
        pooling_type: attention_k_query
    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      low: 0.03
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      low: 1.0
      high: 3.5
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 2
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      low: 0
      high: 2
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      low: 0
      high: 2
      conditional_on:
        pooling_type: attention_k_query
    pool_proj_out_dim:
      type: categorical
      choices: ['none', 32, 64, 128]
      conditional_on:
        pooling_type: attention_k_query

    # === Conditional on pooling_type == mil ===
    mil_hidden:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: mil
    mil_k_top:
      type: int
      low: 10
      high: 50
      conditional_on:
        pooling_type: mil

    # === Conditional on pooling_type == grid ===
    grid_size:
      type: categorical
      choices: [3, 4, 5, 6]
      conditional_on:
        pooling_type: grid
    grid_cell_proj_dim:
      type: categorical
      choices: ['none', 32, 64, 128]
      conditional_on:
        pooling_type: grid
    head_type:
      type: categorical
      choices: [linear, mlp]
      conditional_on:
        pooling_type: grid
    head_hidden_dim:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: grid
        head_type: mlp
