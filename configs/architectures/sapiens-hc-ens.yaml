name: sapiens-hc
description: |
  Sapiens-2 0.1B (~100M), single H100 (80GB). v40: the IS reweighting is DECOUPLED from training.
  train_alpha drives the loss+sampler (0.0 = natural training: metric weight 1/30+y only, full effective
  sample size, no covariate-shift tilt -> no low-occ collapse); eval_alpha=0.5 drives ONLY the
  selection/early-stop score (IS estimate of the intermediate P_target, the interim-leaderboard proxy).
  Gender-balanced batch sampler kept (variance reduction on the fairness gap, orthogonal to IS). Marginal
  P_test alignment is left to post-hoc transport (scripts/recover_ptest.py). Per-alpha scores logged every
  epoch. HPO tightened around the dino-vitb16 winning region (strong regularization).

model:
  backbone: sapiens2_0.1b
  pooling_type: attention
  grid_size: 16
  drop_path: 0.24954642047949524
  head_dropout: 0.18778186308702005
  pooling_dropout: 0.18778186308702005
  head_mlp_ratio: 0.5
  attn_queries: 2

data:
  data_csv: data/raw/train.csv
  remove_csv: data/raw/manual_removals.csv
  image_dir: data/raw
  test_csv: data/raw/test_students.csv
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  val_ratio: 0.05
  val_mode: ptrain_strat
  aug_csv: "data/aug/synthetic_all.csv,data/aug/blend_v3_refined.csv"
  aug_image_dir: data/aug
  aug_proportion: 0.9114876491354087
  aug_level: "off"

training:
  epochs: 15
  batch_size: 512
  lr: 5.072192700049529e-05
  init_backbone_from: runs:/b70b78e861d54a3aae7659c95f9146ad/encoder_100000
  sampler_mode: group_batch
  weight_decay: 0.16089786594976013
  layer_decay: 0.9013337651387768
  warmup_ratio: 0.1
  sampler_participation: 0.75
  is_target: hc
  is_lambda: 0.10
  train_alpha: 0.0
  eval_alpha: 0.5
  lambda_gap: 1.0792134049083095
  gap_asymmetric: true
  early_stop_patience: 4
  seed: 123
  rotate_seed: true
  bf16: true
  num_workers: 16
  save_qualitative_k: 20
  out_dir: results

optuna:
  n_trials: 60
  search_space:
    pretrained_source: {type: categorical, choices: ["ibot:runs:/b70b78e861d54a3aae7659c95f9146ad/encoder_100000", "ibot:runs:/b70b78e861d54a3aae7659c95f9146ad/encoder"]}
    lr: {type: float, low: 4.0e-05, high: 7.0e-05}
    weight_decay: {type: float, low: 0.15, high: 0.4}
    layer_decay: {type: float, low: 0.88, high: 0.95}
    drop_path: {type: float, low: 0.15, high: 0.4}
    aug_proportion: {type: float, low: 0.7, high: 1.0}
    aug_level: {type: categorical, choices: ["off", "light"]}
    attn_queries: {type: categorical, choices: [2, 4, 6]}
    dropout: {type: float, low: 0.15, high: 0.40}
    lambda_gap: {type: float, low: 0.80, high: 1.50}
