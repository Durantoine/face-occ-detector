name: sapiens2-08b-3090
description: Sapiens2-0.8B (818M, trained on 1B human images) finetune for face occlusion regression. 2x RTX 3090 24GB (BF16, DDP, grad-ckpt). No iBOT pretrain — Sapiens2 is already face/human-specialized.

model:
  model_name: sapiens2_0.8b
  output_dim: 1
  hidden_dropout_prob: 0.1
  pooling: mean
  projection_size: null
  output_activation: sigmoid

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null

training:
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  num_train_epochs: 12
  learning_rate: 3.0e-05
  weight_decay: 0.05
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 50
  metric_for_best_model: eval_score
  greater_is_better: false
  bf16: true
  fp16: false
  gradient_checkpointing: true
  augmentation_level: medium
  sampler_strategy: gender
  loss_type: weighted_mse
  loss_focal_gamma: 0.0
  loss_fairness_lambda: 1.0
  loss_importance_reweight: true
  loss_gender_reweight: false
  loss_cell_reweight: false
  loss_patch_mil_alpha: 0.0
  group_dro_alpha: 0.5
  ema_decay: 0.9998
  ema_warmup_steps: 200
  layer_decay: 0.85

optuna:
  n_trials: 60
  objective_mode: score
  rotate_val_seed: true
  search_space:
    learning_rate:
      type: float
      low: 5.0e-06
      high: 1.0e-04
      log: true
    weight_decay:
      type: float
      low: 0.0
      high: 0.3
    num_train_epochs:
      type: int
      low: 8
      high: 16
    warmup_ratio:
      type: float
      low: 0.05
      high: 0.2
    hidden_dropout_prob:
      type: float
      low: 0.0
      high: 0.3
    pooling:
      type: categorical
      choices: [cls, mean, attention]
    balancing_strategy:
      type: categorical
      choices: [A, D, E, F]
    loss_patch_mil_alpha:
      type: categorical
      choices: [0.0, 0.5, 1.0]
    augmentation_level:
      type: categorical
      choices: [light, medium, strong]
    loss_focal_gamma:
      type: float
      low: 0.0
      high: 2.0
    loss_fairness_lambda:
      type: float
      low: 0.5
      high: 2.0
    layer_decay:
      type: float
      low: 0.65
      high: 1.0
