name: sapiens2-01b-3090-v16
description: |
  Sapiens2-0.1B v12 — mirror of dinov3-vitb16 v12.
  See dinov3-vitb16-3090-v12.yaml for rationale.

model:
  model_name: sapiens2_0.1b
  output_dim: 1
  head_dropout: 0.1
  projection_size: null
  output_activation: sigmoid
  pooling_type: attention_k_query   # v16: cls retiré
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  mil_agg: multi
  mil_hidden: 128
  mil_k_top: 30
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null
  val_split_ratio: 0.15
  test_split_ratio: 0.05

training:
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 256
  gradient_accumulation_steps: 1
  num_train_epochs: 13   # PINNED v16 (was HPO). Early stopping decides real duration.
  learning_rate: 5.0e-05
  weight_decay: 0.10
  warmup_ratio: 0.1
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.3   # HPO override via top-level `min_lr_rate` (see search_space)
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 25
  metric_for_best_model: eval_challenge_score
  greater_is_better: false
  bf16: true
  fp16: false
  gradient_checkpointing: false
  augmentation_level: none
  layer_decay: 0.85
  ema_decay: 0.999
  # v16.5 Lagrangien refondu (update per-epoch sur val_err_diff clean)
  loss_lambda_init: 1.0
  loss_lambda_lr: 1.0
  loss_lambda_max: 3.0
  loss_lambda_min: 0.5
  loss_lambda_threshold: 0.001
  adv_lambda: 0.01
  ot_lambda: 0.1
  save_qualitative_k: 10

optuna:
  n_trials: 100
  objective_mode: score
  rotate_val_seed: false   # v16 (was true): fix seed for ensemble + isotonic on common val.
  keep_top_n: 3
  search_space:
    pretrained_source:
      type: categorical
      choices:
        - "sapiens_default"
        - "ibot:runs:/b70b78e861d54a3aae7659c95f9146ad/encoder_50000"
        - "ibot:runs:/b70b78e861d54a3aae7659c95f9146ad/encoder_100000"
        - "ibot:runs:/b70b78e861d54a3aae7659c95f9146ad/encoder"
    pooling_type:
      type: categorical
      choices: [attention_k_query, mil, grid]   # v16: cls retiré

    # v16: single-axis correction under H_C (see docs/v16_theory.md §1)
    correction_strength: {type: float, low: 0.0, high: 1.0}

    feature_fairness:
      type: categorical
      choices: [ot, dann]
    ot_lambda:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: ot
    adv_lambda:
      type: float
      low: 0.001
      high: 0.05
      log: true
      conditional_on:
        feature_fairness: dann
    ot_method:
      type: categorical
      choices: [sliced, sinkhorn]
      conditional_on:
        feature_fairness: ot
    sinkhorn_eps:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: ot
        ot_method: sinkhorn

    loss_focal_gamma: {type: float, low: 0.0, high: 1.5}

    # LR cap 2e-4 + layer_decay cap 0.9 (v11 trials sweet spot).
    learning_rate: {type: float, low: 1.0e-05, high: 1.0e-04, log: true}
    # num_train_epochs PINNED at 13, early_stopping_patience=3 decides real duration.
    min_lr_rate:   {type: float, low: 0.1, high: 0.5}
    weight_decay:  {type: float, low: 0.05, high: 0.50}
    head_dropout:  {type: float, low: 0.0, high: 0.4}
    backbone_drop_path_rate: {type: float, low: 0.0, high: 0.4}
    layer_decay:   {type: float, low: 0.65, high: 0.9}

    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: attention_k_query
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: attention_k_query

    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      low: 0.03   # was 0.05; allow sharper attention (1-2 patches). bf16 safe limit
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      low: 0.5   # was 1.0; allow transition focal↔diffuse
      high: 3.0
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      low: 0   # was 1; allow no diffuse queries (pure focal+free config)
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      low: 0
      high: 3
      conditional_on:
        pooling_type: attention_k_query

    # MIL pooling: mil_agg pinned to "multi" (concat 4 aggs), no HPO needed.
    mil_hidden:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: mil
    mil_k_top:
      type: int
      low: 10
      high: 50
      conditional_on:
        pooling_type: mil

    grid_size:
      type: categorical
      choices: [3, 4, 5, 6, 7]   # 7 utile pour ViT (14x14)
      conditional_on:
        pooling_type: grid
