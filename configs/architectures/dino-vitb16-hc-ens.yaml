name: dino-vitb16-hc
description: |
  DINOv3 ViT-B/16 (dinov3_vitb16, ~86M), single H100 (80GB). v40: IS reweighting DECOUPLED from training.
  train_alpha drives loss+sampler (0.0 = natural training, metric weight 1/30+y only, no low-occ collapse);
  eval_alpha=0.5 drives ONLY selection (IS estimate of the intermediate P_target). Gender-balanced batch
  sampler kept; marginal P_test alignment left to post-hoc transport (scripts/recover_ptest.py). Per-alpha
  scores logged every epoch. HPO TIGHTENED around this study's own winning region (trials #31/#24/#14:
  lr~5.8e-5, wd~0.32, layer_decay~0.90, lambda~0.86, attn_queries~2, aug_proportion high, iBOT c1e1ba1a).

model:
  backbone: dinov3_vitb16
  pooling_type: attention
  grid_size: 4            # unused at attention pooling; kept harmless
  drop_path: 0.18221380288584296
  head_dropout: 0.2626591226296837
  pooling_dropout: 0.2626591226296837
  head_mlp_ratio: 0.5
  attn_queries: 4

data:
  data_csv: data/raw/train.csv
  remove_csv: data/raw/manual_removals.csv
  image_dir: data/raw
  test_csv: data/raw/test_students.csv
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  val_ratio: 0.05
  val_mode: ptrain_strat
  aug_csv: "data/aug/synthetic_all.csv,data/aug/blend_v3_refined.csv"
  aug_image_dir: data/aug
  aug_proportion: 0.880209570350077
  aug_level: light

training:
  epochs: 15
  batch_size: 512        # dinov3_vitb16 + torch.compile: 512 OOMs on 80GB; 256 is safe
  lr: 6.420906052411536e-05
  init_backbone_from: runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder
  sampler_mode: group_batch
  weight_decay: 0.2485925134881937
  layer_decay: 0.931175112509119
  warmup_ratio: 0.1
  sampler_participation: 0.75
  is_target: hc
  is_lambda: 0.10
  train_alpha: 0.0
  eval_alpha: 0.5
  lambda_gap: 1.1834345008401979
  gap_asymmetric: true
  early_stop_patience: 4
  seed: 123
  rotate_seed: true
  bf16: true
  num_workers: 16
  save_qualitative_k: 20
  out_dir: results

optuna:
  n_trials: 60
  search_space:
    pretrained_source: {type: categorical, choices: ["ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder_100000", "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder"]}
    lr: {type: float, low: 4.0e-05, high: 7.0e-05}
    weight_decay: {type: float, low: 0.15, high: 0.40}
    layer_decay: {type: float, low: 0.88, high: 0.95}
    drop_path: {type: float, low: 0.15, high: 0.35}
    aug_proportion: {type: float, low: 0.7, high: 1.0}
    aug_level: {type: categorical, choices: ["off", "light"]}
    attn_queries: {type: categorical, choices: [2, 4, 6]}
    dropout: {type: float, low: 0.15, high: 0.40}
    lambda_gap: {type: float, low: 0.80, high: 1.50}
