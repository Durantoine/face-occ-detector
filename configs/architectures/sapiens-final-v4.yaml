name: sapiens-final-v4
description: |
  Sapiens-2 0.1B (~100M) on a single H100 (80GB). FINAL v3: same v38/v39 logic as v2 (eval_alpha=0.5,
  gender-balanced batch sampler, val-tilted asymmetric fairness, merged aug pool), but the HPO search
  space is TIGHTENED around the region that won on dino-vitb16-H100 (top-3 trials #31/#24/#14):
  strong regularization (weight_decay 0.25-0.45, layer_decay 0.88-0.95), lr ~5-7e-5, lambda_gap ~0.80-1.10,
  high aug_proportion, small attention pooling. Fewer trials, narrower ranges -> faster convergence.

model:
  backbone: sapiens2_0.1b
  pooling_type: attention
  grid_size: 16
  drop_path: 0.20
  head_dropout: 0.2
  head_mlp_ratio: 0.5

data:
  data_csv: data/raw/train.csv
  remove_csv: data/raw/manual_removals.csv
  image_dir: data/raw
  test_csv: data/raw/test_students.csv
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  val_ratio: 0.15
  val_mode: ptrain_strat
  aug_csv: "data/aug/synthetic_all.csv,data/aug/blend_v3_refined.csv"
  aug_image_dir: data/aug
  aug_proportion: 0.0
  aug_level: medium

training:
  epochs: 15
  batch_size: 512
  lr: 5.5e-05
  sampler_mode: group_batch
  weight_decay: 0.30
  layer_decay: 0.92
  warmup_ratio: 0.1
  sampler_participation: 0.75
  is_target: hc
  is_lambda: 0.10
  eval_alpha: 0.0
  lambda_gap: 0.9
  gap_asymmetric: true
  early_stop_patience: 4
  seed: 123
  rotate_seed: true
  bf16: true
  num_workers: 16
  save_qualitative_k: 20
  out_dir: results

optuna:
  n_trials: 60
  search_space:
    pretrained_source: {type: categorical, choices: ["ibot:runs:/b70b78e861d54a3aae7659c95f9146ad/encoder_100000", "ibot:runs:/b70b78e861d54a3aae7659c95f9146ad/encoder"]}
    is_target: {type: categorical, choices: [hc, joint]}
    lr: {type: float, low: 4.5e-05, high: 7.0e-05}
    weight_decay: {type: float, low: 0.2, high: 0.4}
    layer_decay: {type: float, low: 0.88, high: 0.95}
    drop_path: {type: float, low: 0.2, high: 0.4}
    aug_proportion: {type: float, low: 0.8, high: 1.0}
    aug_level: {type: categorical, choices: ["off", "light"]}
    attn_queries: {type: categorical, choices: [1, 2, 4, 6]}
    sampler_participation: {type: float, low: 0.6, high: 1.0}
    dropout: {type: float, low: 0.2, high: 0.40}
    lambda_gap: {type: float, low: 0.80, high: 1.10}
