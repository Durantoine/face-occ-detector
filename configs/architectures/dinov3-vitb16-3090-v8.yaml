name: dinov3-vitb16-3090-v8
description: |
  DINOv3 ViT-B/16 (86M) v8 — 2x RTX 3090 24GB (BF16). Refonte complète du design d'équilibrage
  inspirée du retour sur v3/v4 (top historique 0.00120 avec cell_joint + MMD) et de l'analyse
  multi-versions. Sépare proprement Y-shift (axe 1) et G-fairness (axes 2-5).

  Axe 1 — Y shift correction (3 mécaniques, force totale γ ∈ [0.5, 1])
    axis1_strength       : γ (intensité totale, r^γ effet final sur gradient)
    axis1_sampler_share  : a (poids du sampler test_pmf, ∈ [0, 1])
    axis1_loss_share     : b (poids du loss imp_rw, ∈ [0, 1-a])
    aug_share (déduit)   : c = 1 - a - b (Y-conditional augmentation)
    → sampler ∝ r^(γa), loss ∝ r^(γb), aug k_i = r^(γc) (stochastic Bernoulli rounding)
    → effet combiné gradient = r^γ (a+b+c=1)

  Axe 2 — Soft G compensation (cell_rw 1/sqrt(count(g,b)))
    axis2_power ∈ [0, 1]  : intensité (0=off, 1=full sqrt, top v4 utilisait full)
    Préserve P(G|Y)_train approximativement, compense rareté cellules sans 50/50 forcé.

  Axe 3 — Feature / data fairness
    feature_fairness ∈ {none, mmd, mixup_gender}
    MMD aligne features F/M dans RKHS. mixup_gender mélange F-M intra-bin.

  Axe 4 — Auto hard examples (focal loss)
    loss_focal_gamma ∈ [0, 3]  : auto-pondère les samples mal prédits

  Axe 5 — Assurance fairness gap
    loss_fairness_lambda ∈ [0, 2]  : pénalité directe sur |err_F - err_M|

  Pinned :
    loss_type = weighted_mse  (data v4 : weighted_mse > group_dro nettement)
    ema_decay = 0             (EMA off, on garde load_best_model_at_end → meilleur checkpoint)
    val_split_strategy = test_pmf + eval_importance_reweight = false (Option B' v6.5)

model:
  model_name: dinov3_vitb16
  output_dim: 1
  head_dropout: 0.1
  projection_size: null
  output_activation: sigmoid
  pooling_type: attention_k_query
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  num_heads: 4
  gem_p_init: 3.0
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null
  val_split_ratio: 0.15

training:
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  num_train_epochs: 10
  learning_rate: 5.0e-05
  weight_decay: 0.05
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 50
  metric_for_best_model: eval_challenge_score
  greater_is_better: false
  val_split_strategy: test_pmf
  eval_importance_reweight: false
  bf16: true
  fp16: false
  gradient_checkpointing: false
  augmentation_level: medium     # PINNED : magnitude safe, quantité gérée par aug_share
  loss_type: weighted_mse        # PINNED : data v4 confirme weighted_mse > group_dro
  ema_decay: 0                   # PINNED : EMA off, load_best_model_at_end actif
  ema_warmup_steps: 0
  layer_decay: 0.85

optuna:
  n_trials: 200
  objective_mode: score
  rotate_val_seed: true
  search_space:
    pretrained_source:
      type: categorical
      choices:
        - "lvd"
        - "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder_50000"
        - "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder_100000"
        - "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder"
    pooling_type:
      type: categorical
      choices: [attention_k_query, multihead_attention]

    # === Axe 1 — Y shift correction (3 mécaniques) ===
    axis1_strength:
      type: float
      low: 0.5
      high: 1.0
    axis1_sampler_share:
      type: float
      low: 0.0
      high: 1.0
    axis1_loss_fraction:
      type: float
      low: 0.0
      high: 1.0
      # Stick-breaking sur le 2-simplexe (cf _refresh_axis1_powers) :
      #   b = (1 - sampler_share) × loss_fraction         (loss share effectif)
      #   c = (1 - sampler_share) × (1 - loss_fraction)   (aug share déduit)
      # Garantit a + b + c = 1 sans normalisation post-hoc. TPE explore proprement le simplexe.

    # === Axe 2 — Soft G compensation (cell_rw 1/sqrt^power) ===
    axis2_power:
      type: float
      low: 0.0
      high: 1.0

    # === Axe 3 — Feature fairness ===
    feature_fairness:
      type: categorical
      choices: [none, mmd, mixup_gender]

    # === Axe 4 — Auto hard examples ===
    loss_focal_gamma:
      type: float
      low: 0.0
      high: 3.0

    # === Axe 5 — Assurance fairness gap ===
    loss_fairness_lambda:
      type: float
      low: 0.0
      high: 2.0

    # === Hyperparams classiques ===
    learning_rate:
      type: float
      low: 1.0e-05
      high: 2.0e-04
      log: true
    weight_decay:
      type: float
      low: 0.0
      high: 0.3
    num_train_epochs:
      type: int
      low: 8
      high: 15
    warmup_ratio:
      type: float
      low: 0.05
      high: 0.2
    head_dropout:
      type: float
      low: 0.0
      high: 0.3
    layer_decay:
      type: float
      low: 0.65
      high: 0.95
    backbone_drop_path_rate:
      type: float
      low: 0.0
      high: 0.2

    # === Conditional on pooling_type ∈ {attention_k_query, multihead_attention} ===
    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: [attention_k_query, multihead_attention]
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: [attention_k_query, multihead_attention]

    # === Conditional on pooling_type == attention_k_query ===
    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      low: 0.08
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      low: 1.0
      high: 4.0
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      low: 1
      high: 6
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      low: 0
      high: 4
      conditional_on:
        pooling_type: attention_k_query

    # === Conditional on pooling_type == multihead_attention ===
    num_heads:
      type: categorical
      choices: [2, 4, 8, 16]
      conditional_on:
        pooling_type: multihead_attention

    # === Conditional on feature_fairness ===
    mmd_lambda:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: mmd
    mixup_alpha:
      type: float
      low: 0.1
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: mixup_gender
