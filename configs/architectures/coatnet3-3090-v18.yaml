name: coatnet3-3090-v18
description: |
  CoAtNet-3 (Dai et al. 2021) — 167M params, native 224, IN-12k pretrain.
  ~4x capacité de CoAtNet-1. Pretrain IN-12k = ~12k classes (subset filtre IN-22k),
  beaucoup plus de donnees que IN-1k -> meilleure init.

  Adjustments vs coatnet1-v18 :
    - batch_size: 64 -> 24 (4x params, memory bound sur 3090 24GB)
    - gradient_accumulation_steps: 1 -> 2 (effective batch 48, garde stat de gradient)
    - learning_rate cap: 1e-4 -> 5e-5 (gros modeles preferent LR plus petit)
    - layer_decay HPO: monte cote actif (LLRD utile sur 28 blocks vs 14 coatnet1)
    - backbone_drop_path_rate HPO high 0.5 (regularise gros modele sur 80k samples)

model:
  model_name: coatnet_3_rw_224.sw_in12k    # timm: 167M, IN-12k pretrain
  output_dim: 1
  head_dropout: 0.2
  projection_size: null
  output_activation: sigmoid
  pooling_type: attention_k_query
  # image_size: omitted → default 224 (CoAtNet-1 native)
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  mil_agg: multi
  mil_hidden: 128
  mil_k_top: 30
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null
  val_split_ratio: 0.15
  test_split_ratio: 0.05

training:
  per_device_train_batch_size: 24    # CoAtNet-3 167M @ 224, fp16 -> batch 24 sur 24GB
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 2     # effective batch = 24 * 2 * 2_GPUs = 96
  num_train_epochs: 13
  learning_rate: 5.0e-05
  weight_decay: 0.05
  warmup_ratio: 0.1
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.3
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 25
  metric_for_best_model: eval_challenge_score
  greater_is_better: false
  bf16: false
  fp16: true                  # CoAtNet stable en fp16 (vs bf16 imprécis sur BN)
  gradient_checkpointing: true   # save memory on 167M model
  augmentation_level: none
  layer_decay: 0.85           # LLRD on (28 blocks, gros modele benef de LR decay par couche)
  # v17 Lagrangien per-epoch sur val_err_diff (signal CLEAN 15k samples).
  # Δλ = lr · (val_err_diff − threshold), clip in [λ_min, λ_max].
  loss_lambda_init: 1.0
  loss_lambda_lr: 0.2            # log-space gain on log(val_err_diff/threshold)
  loss_lambda_max: 3.0            # marge haute, log() sature naturellement
  loss_lambda_min: 1.0            # >= poids metrique (toujours pousser fairness)
  loss_lambda_threshold: 0.0005   # zone equilibre
  adv_lambda: 0.01
  ot_lambda: 0.1
  save_qualitative_k: 10

optuna:
  n_trials: 100
  objective_mode: score
  rotate_val_seed: false
  keep_top_n: 3
  search_space:
    pooling_type:
      type: categorical
      choices: [attention_k_query, mil, grid]

    correction_strength: {type: float, low: 0.0, high: 1.0}

    feature_fairness:
      type: categorical
      choices: [none, ot, dann]
    ot_lambda:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: ot
    adv_lambda:
      type: float
      low: 0.001
      high: 0.05
      log: true
      conditional_on:
        feature_fairness: dann
    ot_method:
      type: categorical
      choices: [sliced, sinkhorn]
      conditional_on:
        feature_fairness: ot
    sinkhorn_eps:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: ot
        ot_method: sinkhorn

    loss_focal_gamma: {type: float, low: 0.0, high: 1.5}

    learning_rate: {type: float, low: 1.0e-05, high: 5.0e-05, log: true}
    min_lr_rate:   {type: float, low: 0.1, high: 0.5}
    weight_decay:  {type: float, low: 0.01, high: 0.20}
    head_dropout:  {type: float, low: 0.1, high: 0.4}
    backbone_drop_path_rate: {type: float, low: 0.0, high: 0.5}    # gros modele, plus de regularisation
    layer_decay:   {type: float, low: 0.6, high: 1.0}              # LLRD utile sur 28 blocks

    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: attention_k_query
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: attention_k_query
    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      low: 0.03
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      low: 0.5
      high: 3.0
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 2
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      low: 0
      high: 2
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      low: 0
      high: 2
      conditional_on:
        pooling_type: attention_k_query

    mil_hidden:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: mil
    mil_k_top:
      type: int
      low: 10
      high: 50
      conditional_on:
        pooling_type: mil

    # Grid pooling: 2×2 (4 régions) ou 3×3 (9 régions)
    grid_size:
      type: categorical
      choices: [3, 4, 5, 6]
      conditional_on:
        pooling_type: grid
