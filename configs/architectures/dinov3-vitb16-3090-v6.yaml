name: dinov3-vitb16-3090-v6
description: |
  DINOv3 ViT-B/16 (86M) v6 — 2x RTX 3090 24GB (BF16). Stratified val (préserve diversité
  high-Y au training) + 4 nouvelles stratégies d'équilibrage qui ciblent err_M >> err_F :
    Sampler   : + gender_within_occ, gender_within_test_pmf
    Loss rw   : + cell_within_occ, cell_within_test_pmf
  Toutes égalisent F/M intra-bin sans surreprésenter les cellules rares (≠ gender_x_occ).
  Quantile matching post-train désactivé sur stratified_yg (Option B : metric trompeuse).
  Backbone iBOT pin sur encoder final via init_backbone_from.

model:
  model_name: dinov3_vitb16
  output_dim: 1
  head_dropout: 0.1
  projection_size: null
  output_activation: sigmoid
  # `pretrained` est forcé à True par Optuna via le mapping pretrained_source
  # (cf. _apply_trial_param) — pas la peine de le dupliquer ici.
  pooling_type: attention_k_query
  # Attention K-query
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  # Multi-head
  num_heads: 4
  # GeM
  gem_p_init: 3.0
  # Common pool
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0
  # init_backbone_from RETIRÉ : pretrained_source dans le search_space avec 3 choix
  # (encoder_100000 / encoder final / lvd). Data v4 dit encoder_100000 > encoder final
  # → on laisse Optuna trancher proprement plutôt que de pinner sur l'un.

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null

training:
  # 3090 24GB BF16 : BS=32 par GPU × 2 GPUs = 64 effectif (= v4)
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  num_train_epochs: 8
  learning_rate: 5.0e-05
  weight_decay: 0.05
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 50
  metric_for_best_model: eval_challenge_score_test_estimated
  # v6 : stratified_yg pour préserver la diversité high-Y au training (test_pmf vidait les
  # bins 14-19, là où err_M sur high-Y M est précisément le problème à corriger).
  # _test_estimated reste l'estimateur principal (importance reweighting eval-time, biaisé
  # variance amplifiée sur bins haut-Y mais non-biaisé en espérance).
  val_split_strategy: stratified_yg
  greater_is_better: false
  # Ampere → BF16
  bf16: true
  fp16: false
  gradient_checkpointing: false
  augmentation_level: medium
  loss_type: weighted_mse
  loss_focal_gamma: 0.0
  loss_fairness_lambda: 1.0
  loss_query_diversity_lambda: 0.0
  eval_importance_reweight: true
  save_qualitative_k: 10
  group_dro_alpha: 0.5
  ema_decay: 0.9995
  ema_warmup_steps: 200
  layer_decay: 0.85

optuna:
  n_trials: 200
  objective_mode: score
  rotate_val_seed: true
  search_space:
    # v6 : pretrained_source remis dans le search_space.
    # Re-mesure data v4 (34 trials actifs) : mean best_score par source —
    #   encoder        : 0.00232 (21 trials, top 1 = 0.00151)  ← MEILLEUR
    #   encoder_50000  : 0.00211 (4 trials, mean équiv. mais petit n)
    #   encoder_100000 : 0.00467 (5 trials, décevant — contredit l'hypothèse initiale)
    #   lvd            : 0.00595 (4 trials, worst en v4)
    # `lvd` (= poids Meta DINOv3 LVD par défaut, analogue de sapiens_default) gardé
    # comme baseline / contrôle symétrique avec sapiens v6.
    pretrained_source:
      type: categorical
      choices:
        - "lvd"                                                          # Meta default (baseline)
        - "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder_50000"    # early snapshot
        - "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder_100000"   # mid (décevant v4)
        - "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder"          # final, best v4
    pooling_type:
      type: categorical
      # v6 : retiré cls + gem (data v4 montre que les meilleurs Sapiens / gros modèles
      # bénéficient de l'attention pooling, et c'est là que la perf finale se joue).
      choices: [attention_k_query, multihead_attention]
    # === Stratégies d'équilibrage v4 — décomposées sur 3 axes orthogonaux ===
    # Voir README §"Stratégies d'équilibrage — 3 axes" pour la matrice complète.
    #   Axe 1 (sampler)       : équilibrage data-level
    #   Axe 2 (loss reweight) : reweighting dans la loss
    #   Axe 3 (feature fair)  : invariance genre au niveau features
    sampler_strategy:
      type: categorical
      # v6 : 4 choix orthogonaux couvrant (Y∈{none, P_test} × G∈{none, 50/50 intra-bin}).
      # Retiré v6 :
      #   - gender (no-op équivalent à `none` côté gradient cf docs/fairness.md §3)
      #   - gender_x_occ (overfit, avg 0.01345 v4)
      #   - occlusion (quantile flatten = approx grossière du shift, redondant avec test_pmf
      #     qui calibre exactement P_test, et ne corrige pas G — doublement inférieur)
      choices:
        - "none"
        - "test_pmf"                   # data : Y → P_test, no G correction
        - "gender_within_occ"          # NEW : 50/50 F/M intra-bin, Y reste P_train
        - "gender_within_test_pmf"     # NEW : 50/50 F/M intra-bin + Y → P_test
    loss_rw_strategy:
      type: categorical
      # v6 : cell_joint retiré (avg 0.00639 sur v4, jamais dans le top). Remplacé
      # conceptuellement par cell_within_* qui corrige correctement la rareté intra-bin.
      choices:
        - "none"
        - "imp_rw"
        - "cell_within_occ"            # NEW : 50/50 F/M intra-bin via loss, Y reste P_train
        - "cell_within_test_pmf"       # NEW : 50/50 F/M intra-bin via loss + Y → P_test
      # Évite la double correction : seul `sampler=none` laisse le loss libre d'appliquer
      # ses propres corrections. Si le sampler corrige déjà Y et/ou G, le loss reste à `none`.
      # Quand loss_type=group_dro, le reweight n'est pas appliqué non plus.
      conditional_on:
        sampler_strategy: ["none"]
        loss_type: weighted_mse
    feature_fairness:
      type: categorical
      # Retiré v6 : dann (avg 0.01246 v4, très instable — adversarial training fragile).
      # `mmd` couvre le même objectif (features gender-invariant) plus proprement.
      choices:
        - "none"
        - "mmd"
        - "mixup_gender"
    learning_rate:
      type: float
      low: 1.0e-05
      high: 2.0e-04
      log: true
    weight_decay:
      type: float
      low: 0.0
      high: 0.3
    num_train_epochs:
      type: int
      low: 8
      high: 15
    warmup_ratio:
      type: float
      low: 0.05
      high: 0.2
    head_dropout:
      type: float
      low: 0.0
      high: 0.3
    augmentation_level:
      type: categorical
      choices: [none, light, medium, strong]
    loss_type:
      type: categorical
      choices: [weighted_mse, group_dro]
    # Only sampled when loss_type=weighted_mse (group_dro ignores fairness_lambda + focal_gamma).
    loss_fairness_lambda:
      type: float
      low: 0.0
      high: 2.0
      conditional_on:
        loss_type: weighted_mse
    loss_focal_gamma:
      type: float
      low: 0.0
      high: 2.0
      conditional_on:
        loss_type: weighted_mse
    # Only sampled when loss_type=group_dro.
    group_dro_alpha:
      type: float
      low: 0.1
      high: 1.0
      conditional_on:
        loss_type: group_dro
    layer_decay:
      type: float
      # v6 : high resserré 1.0 → 0.95 (data v4 : aucun trial du top 20 n'utilise LLRD off ;
      # top values ∈ [0.65, 0.87]). Économise des trials sur la zone morte.
      low: 0.65
      high: 0.95
    backbone_drop_path_rate:
      type: float
      low: 0.0
      high: 0.2

    # === Conditional on pooling_type ∈ {attention_k_query, multihead_attention} ===
    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: [attention_k_query, multihead_attention]
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: [attention_k_query, multihead_attention]

    # === Conditional on pooling_type == attention_k_query ===
    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      # v6 : low 0.05 → 0.08 (data v4 : top 10 ∈ [0.09, 0.17], zone < 0.08 jamais explorée).
      low: 0.08
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      # v6 : high 3.0 → 4.0 (data v4 : top trials à 2.89, 2.76, 2.74, borne haute mord).
      low: 1.0
      high: 4.0
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      # v6 : high 4 → 6 (data v4 : 6/20 top trials collent à n_diffuse=4, dont le top 1).
      low: 1
      high: 6
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      # v6 : high 3 → 4 (data v4 : top 1, 2, 5 utilisent n_free=3, borne haute mord).
      low: 0
      high: 4
      conditional_on:
        pooling_type: attention_k_query

    # === Conditional on pooling_type == multihead_attention ===
    num_heads:
      type: categorical
      # Divisors common to ViT-B (768) / ViT-L (1024) / ViT-H+ (1280) — keeps search space
      # portable across backbones without arch-specific yaml duplication.
      choices: [2, 4, 8, 16]
      conditional_on:
        pooling_type: multihead_attention

    # === Conditional on feature_fairness (axe 3) — mmd_lambda / mixup_alpha ===
    # adv_lambda retiré avec dann (cf feature_fairness choices).
    mmd_lambda:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: mmd
    mixup_alpha:
      type: float
      # v6 : high 0.5 → 1.0 log (data v4 : top mixup trials à 0.491, 0.484, borne mord ;
      # log permet d'explorer aussi mix faibles α≈0.1 qui dominent le top 1-2).
      low: 0.1
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: mixup_gender
