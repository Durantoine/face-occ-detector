[project]
name = "face-occ-detector"
version = "0.1.0"
description = "Face occlusion detection model"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.7.0,<3.0.0",
    "torchvision>=0.22.0,<1.0.0",
    "transformers[torch]>=4.46.0,<4.50.0",
    "accelerate>=0.34.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "threadpoolctl>=3.1.0",
    "pyyaml>=6.0.0",
    "mlflow>=2.18.0",
    "optuna>=3.0.0",
    "optuna-dashboard>=0.15.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "torchmetrics",
    "termcolor",
    "webdataset>=0.2.86",
    "safetensors>=0.4.0",
    "sapiens @ git+https://github.com/facebookresearch/sapiens2.git",
    # zero-shot pipeline (MediaPipe pose + SAM2 + Qwen2.5-VL)
    "mediapipe>=0.10.0",
    "sam2>=1.0.0",
    "qwen-vl-utils>=0.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "invoke>=2.2.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "ipython>=8.0.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
    "pandas-stubs>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
extra-index-url = ["https://pypi.org/simple"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
#If not use RTX5080, cu126 works 
name = "pytorch-cu128" 
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_unreachable = false
strict_equality = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "transformers.*",
    "sklearn.*",
    "matplotlib.*",
    "mlflow.*",
    "optuna.*",
    "seaborn.*",
    "yaml.*",
    "pandas.*",
    "requests.*",
    "numpy.*",
    "PIL.*",
    "mediapipe.*",
    "cv2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.train"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pymupdf>=1.27.2.3",
]
