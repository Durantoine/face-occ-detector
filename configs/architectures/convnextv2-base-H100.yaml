name: convnextv2-base-H100-v39
description: |
  ConvNeXt-V2-Base (~89M) on a single H100 (80GB). v39 pipeline: Fresh run after v38 appeared stuck.
  IS-stratified eval/selection on the INTERMEDIATE target.
  Optimized for large-batch training (512) on H100.

model:
  backbone: convnextv2_base.fcmae_ft_in22k_in1k
  pooling_type: attention
  grid_size: 7
  drop_path: 0.10        # Standard for ConvNeXt-Base
  head_dropout: 0.1
  head_mlp_ratio: 0.5

data:
  data_csv: data/raw/train.csv
  remove_csv: data/raw/manual_removals.csv
  image_dir: data/raw
  test_csv: data/raw/test_students.csv
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  val_ratio: 0.15
  val_mode: ptrain_strat
  aug_csv: "data/aug/synthetic_all.csv"
  aug_image_dir: data/aug
  aug_proportion: 0.0
  aug_level: medium

training:
  epochs: 15
  batch_size: 512        # Large batch for H100 (80GB) throughput
  lr: 2.0e-04            # Scaled for batch 512
  sampler_mode: group_batch
  weight_decay: 0.05
  layer_decay: 0.80      # Standard for ConvNeXt-Base
  warmup_ratio: 0.1
  sampler_participation: 1.0
  is_target: joint
  is_lambda: 0.10
  eval_alpha: 0.3
  lambda_gap: 1.0
  gap_asymmetric: true
  early_stop_patience: 4
  seed: 123
  rotate_seed: true
  bf16: true
  num_workers: 16
  save_qualitative_k: 20
  out_dir: results

optuna:
  n_trials: 80
  search_space:
    is_target: {type: categorical, choices: [hc, joint]}
    lr: {type: float, low: 8.0e-05, high: 6.0e-04, log: true}
    weight_decay: {type: float, low: 0.05, high: 0.40}
    layer_decay: {type: float, low: 0.75, high: 0.90}
    drop_path: {type: float, low: 0.05, high: 0.25}
    aug_proportion: {type: float, low: 0.4, high: 1.0}
    aug_level: {type: categorical, choices: ["off", "light", "medium"]}
    attn_queries: {type: categorical, choices: [2, 4, 8]}
    pooling_type: {type: categorical, choices: [attention, grid]}
    sampler_participation: {type: float, low: 0.3, high: 1.0}
    dropout: {type: float, low: 0.10, high: 0.40}
    lambda_gap: {type: float, low: 0.5, high: 1.5}
