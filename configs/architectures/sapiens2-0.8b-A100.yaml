name: sapiens2-0.8b-A100
description: |
  Sapiens-2 0.8B (hidden 1280) on a single A100. v36 pipeline: full train.csv, single regularized
  ratio w = P_test/(P_train+is_lambda) for sampler+loss (real P_train for the eval metric),
  augmentation pool appended to train (ratio refit on the pool).

model:
  backbone: sapiens2_0.8b
  pooling_type: attention
  grid_size: 16
  drop_path: 0.15
  head_dropout: 0.1
  head_mlp_ratio: 0.5     # regularized MLP head

data:
  data_csv: data/raw/train.csv
  remove_csv: data/raw/manual_removals.csv
  image_dir: data/raw
  test_csv: data/raw/test_students.csv
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  val_ratio: 0.15
  val_mode: ptrain_strat  # stratified PROPORTIONAL: exact per-stratum counts (lower variance than random)
  aug_csv: "data/aug/synthetic_all.csv"
  aug_image_dir: data/aug
  aug_proportion: 0.0
  aug_level: medium       # on-the-fly aug (off|light|medium); per-sample intensity scaled by importance w

training:
  epochs: 12
  batch_size: 128        # 0.8B on A100 80GB
  lr: 4.0e-05
  weight_decay: 0.05
  layer_decay: 0.9
  warmup_ratio: 0.1
  sampler_participation: 1.0
  is_target: joint        # fixed (metric is gender-aware); not searched
  is_lambda: 0.10
  lambda_gap: 1.0
  lambda_adaptive: true
  lambda_lr: 0.8
  lambda_min: 0.5
  lambda_max: 3.0
  lambda_threshold: 0.0
  early_stop_patience: 4
  seed: 42
  bf16: true
  num_workers: 16
  save_qualitative_k: 20
  out_dir: results

optuna:
  # v36: trimmed to the 6 levers that reliably matter (+ pretrained_source).
  n_trials: 80
  search_space:
    pretrained_source: {type: categorical, choices: ["sapiens_default", "ibot:runs:/79c6c648e92545e09e29f04fb0979e56/encoder_12000"]}
    lr: {type: float, low: 1.5e-05, high: 5.0e-05, log: true}
    weight_decay: {type: float, low: 0.01, high: 0.4, log: true}
    layer_decay: {type: float, low: 0.8, high: 0.99}
    drop_path: {type: float, low: 0.05, high: 0.4}
    aug_proportion: {type: float, low: 0.0, high: 1.0}
    aug_level: {type: categorical, choices: ["off", "light", "medium"]}
    attn_queries: {type: categorical, choices: [2, 4, 8]}
    sampler_participation: {type: float, low: 0.5, high: 1.0}
    lambda_lr: {type: float, low: 0.5, high: 3.0}
    dropout: {type: float, low: 0.0, high: 0.3}
