name: dinov3-vitb16-3090-v15
description: |
  DINOv3 ViT-B/16 (86M) v12 — refinements on top of v11.

  Changes vs v11:
    - K-query HPO ranges RESTORED to v4 (n_focal/n_diffuse [1,4], n_free [0,3],
      dropouts [0, 0.3], tau_focal [0.05, 0.3], tau_diffuse [1, 3]) — v11 had tightened
      these which reduced exploration of configs that produced v4's best (0.0012).
    - DANN re-added to feature_fairness choices ({none, ot, dann}); MMD stays removed.
      adv_lambda back in HPO conditional.
    - min_lr_rate: 0.1 -> 0.3 (gentler cosine decay; v11 decayed too aggressively).
    - logging_steps: 200 -> 25 (faster MLflow refresh; safe with non-blocking writes).
    - ema_decay: 0.999 (restored; was temporarily disabled in v11 for debug).

model:
  model_name: dinov3_vitb16
  output_dim: 1
  head_dropout: 0.1
  projection_size: null
  output_activation: sigmoid
  pooling_type: cls   # native DINOv3 head — best alignment with pretraining
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  mil_agg: multi
  mil_hidden: 128
  mil_k_top: 30
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null
  # Tri-split v12: train iid 80% / val iid 15% (stratified IS metric) / test holdout 5%
  # (match P_test via H_C) — see docs/v12_theory.md §3 for rationale.
  val_split_ratio: 0.15
  test_split_ratio: 0.05

training:
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 256
  gradient_accumulation_steps: 1
  num_train_epochs: 13   # PINNED v15 (was HPO [7,13]). Rationale: decouple from LR shape;
                          # rely on early_stopping_patience=3 for actual duration.
  learning_rate: 5.0e-05
  weight_decay: 0.10
  warmup_ratio: 0.1
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.3   # HPO override via top-level `min_lr_rate` in training section (see below)
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 25
  metric_for_best_model: eval_challenge_score
  greater_is_better: false
  bf16: true
  fp16: false
  gradient_checkpointing: false
  augmentation_level: none
  layer_decay: 0.85
  ema_decay: 0.999
  # Lagrangien adaptatif : λ peut monter ET descendre grâce au threshold (fix v14).
  # λ_{t+1} = clip(λ_t + lr · (err_diff_ema - threshold), 0, λ_max)
  #   err_diff > threshold → contrainte violée → λ monte
  #   err_diff < threshold → contrainte satisfaite → λ descend
  loss_lambda_init: 1.0
  loss_lambda_lr: 0.5
  loss_lambda_max: 5.0
  loss_lambda_ema: 0.9
  loss_lambda_threshold: 0.0005
  adv_lambda: 0.01
  ot_lambda: 0.1
  save_qualitative_k: 10

optuna:
  n_trials: 100
  objective_mode: score
  rotate_val_seed: false   # v15 (was true): fix seed so all trials see SAME val split.
                            # Enables ensemble + isotonic on common val without retraining.
                            # Variance protection via large val (15k) + stratified IS + test holdout.
  keep_top_n: 3
  search_space:
    pretrained_source:
      type: categorical
      choices:
        - "lvd"
        - "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder"
    pooling_type:
      type: categorical
      choices: [cls, gap, attention_k_query, mil]   # +gap (mean over all tokens, no CLS bias)

    axis1_power: {type: float, low: 0.0, high: 1.0}
    axis2_power: {type: float, low: 0.0, high: 1.0}

    feature_fairness:
      type: categorical
      choices: [none, ot, dann]
    ot_lambda:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: ot
    adv_lambda:
      type: float
      low: 0.001
      high: 0.05
      log: true
      conditional_on:
        feature_fairness: dann

    loss_focal_gamma: {type: float, low: 0.0, high: 1.5}

    # LR + LLRD ranges informed by v11 trials analysis:
    # - Sweet spot: LR ∈ [1e-4, 2.1e-4] with layer_decay ∈ [0.75, 0.87]
    # - Hence: cap LR at 2e-4 AND layer_decay at 0.9 (was 1.0)
    learning_rate: {type: float, low: 1.0e-05, high: 1.0e-04, log: true}
    # num_train_epochs PINNED at 13 (max), early_stopping_patience=3 decides real duration.
    # LR scheduler shape decoupled via min_lr_rate HPO.
    min_lr_rate:   {type: float, low: 0.1, high: 0.5}
    weight_decay:  {type: float, low: 0.05, high: 0.50}
    head_dropout:  {type: float, low: 0.0, high: 0.4}
    backbone_drop_path_rate: {type: float, low: 0.0, high: 0.4}
    layer_decay:   {type: float, low: 0.65, high: 0.9}

    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: attention_k_query
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: attention_k_query

    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      low: 0.03   # was 0.05; allow sharper attention (1-2 patches). bf16 safe limit
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      low: 0.5   # was 1.0; allow transition focal↔diffuse
      high: 3.0
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      low: 0   # was 1; allow no diffuse queries (pure focal+free config)
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      low: 0
      high: 3
      conditional_on:
        pooling_type: attention_k_query


    # === MIL pooling (Multi-Instance Learning) ===
    # mil_agg pinned to "multi" (concat of mean+max+topk+gated_attn) — no HPO since
    # multi includes all 4 single-agg modes via its (B, 4) feature passed to head.
    mil_hidden:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: mil
    mil_k_top:
      type: int
      low: 10
      high: 50
      conditional_on:
        pooling_type: mil
