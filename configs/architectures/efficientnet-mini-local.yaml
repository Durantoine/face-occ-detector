name: efficientnet-mini-local
description: |
  EfficientNet-B0 (timm efficientnet_b0, ~5M) — IDEAL single run (NO HPO), tuned for an M3 Max (MPS).
  v37 pipeline: eval_alpha=0.5 intermediate IS target (between P_train and P_test = the interim),
  joint per-gender reweighting, fixed fairness lambda=1.0, 100% of the synthetic aug pool + on-the-fly
  light aug. fp32 (MPS has no bf16 autocast), torch.compile OFF (unreliable on MPS).
  Run: python src/train.py efficientnet-mini-local

model:
  backbone: efficientnet_b0
  pooling_type: attention
  attn_queries: 4
  grid_size: 7              # unused under attention (b0 -> 7x7=49 tokens); kept if you switch to grid pooling
  drop_path: 0.2
  pooling_dropout: 0.2
  head_dropout: 0.2
  head_mlp_ratio: 0.5       # regularized MLP head Linear(D->D/2)->GELU->Dropout->Linear

data:
  data_csv: data/raw/train.csv
  remove_csv: data/raw/manual_removals.csv
  image_dir: data/raw
  test_csv: data/raw/test_students.csv
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  val_ratio: 0.15
  val_mode: ptrain_strat    # proportional val; eval_alpha does the P_train<->P_test reweighting in the score
  aug_csv: "data/aug/synthetic_all.csv"
  aug_image_dir: data/aug
  aug_proportion: 1.0        # 100% du pool synthétique injecté (occlusions rendues, M-skewed mid/haute-occ)
  aug_level: light           # aug à la volée label-preserving (intensité scalée par le poids d'importance)

training:
  epochs: 15
  batch_size: 128            # b0 ~5M, fp32 sur la mémoire unifiée M3 Max — confortable
  lr: 1.5e-04                # un CNN fine-tune tolère un lr plus haut que les ViT
  weight_decay: 0.2          # forte régularisation (petit modèle qui overfit la queue rare)
  layer_decay: 0.9           # LLRD doux : préserve les features b0 pré-entraînées (pool/head au lr plein)
  warmup_ratio: 0.1
  sampler_participation: 1.0 # 1.0 = pur sampler ; 0 = pure loss
  is_target: joint           # ratios F/M séparés (métrique gender-aware)
  is_lambda: 0.10            # plancher de régularisation de P_train dans w = P_test/(P_train+is_lambda)
  eval_alpha: 0.5            # cible IS intermédiaire (proxy interim) ; la sélection se fait dessus
  lambda_gap: 1.0            # poids fairness FIXE = structure exacte de la métrique challenge (moy + |gap|)
  lambda_adaptive: false     # v37 : lambda non adaptatif
  early_stop_patience: 4
  seed: 42
  bf16: false                # MPS n'a pas d'autocast bf16 dans ce pipeline
  compile_model: false       # torch.compile peu fiable / lent sur MPS
  num_workers: 8
  save_qualitative_k: 20     # images worst/best dans l'UI (le bug d'affichage vient d'être corrigé)
  log_test_pred: false       # évite l'inférence test 30k à chaque new-best (lent sur MPS) ; passe à true si tu veux la voir
  out_dir: results
