name: sapiens-final-v2
description: |
  Sapiens-2 0.1B (~100M) on a single H100 (80GB). FINAL run: v38/v39 logic, eval_alpha=0.5 (midpoint
  intermediate target), gender-balanced batch sampler, val-tilted asymmetric fairness penalty, and the
  MERGED augmentation pool (synthetic_all + blend_v3_refined high-occ blends, occ 0.46-0.62).

model:
  backbone: sapiens2_0.1b
  pooling_type: attention
  grid_size: 16
  drop_path: 0.15
  head_dropout: 0.1
  head_mlp_ratio: 0.5

data:
  data_csv: data/raw/train.csv
  remove_csv: data/raw/manual_removals.csv
  image_dir: data/raw
  test_csv: data/raw/test_students.csv
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  val_ratio: 0.15
  val_mode: ptrain_strat
  aug_csv: "data/aug/synthetic_all.csv,data/aug/blend_v3_refined.csv"   # merged: synthetic_all + 60 high-occ blends
  aug_image_dir: data/aug                                               # all aug images (incl. blend) live here
  aug_proportion: 0.0
  aug_level: medium

training:
  epochs: 15
  batch_size: 512
  lr: 5.0e-05
  sampler_mode: group_batch
  weight_decay: 0.05
  layer_decay: 0.9
  warmup_ratio: 0.1
  sampler_participation: 1.0
  is_target: joint
  is_lambda: 0.10
  eval_alpha: 0.5
  lambda_gap: 1.0
  gap_asymmetric: true
  early_stop_patience: 4
  seed: 123
  rotate_seed: true
  bf16: true
  num_workers: 16
  save_qualitative_k: 20
  out_dir: results

optuna:
  n_trials: 80
  search_space:
    pretrained_source: {type: categorical, choices: ["sapiens_default", "ibot:runs:/b70b78e861d54a3aae7659c95f9146ad/encoder_100000", "ibot:runs:/b70b78e861d54a3aae7659c95f9146ad/encoder"]}
    is_target: {type: categorical, choices: [hc, joint]}
    lr: {type: float, low: 2.0e-05, high: 8.0e-05}
    weight_decay: {type: float, low: 0.05, high: 0.45}
    layer_decay: {type: float, low: 0.80, high: 0.95}
    drop_path: {type: float, low: 0.10, high: 0.45}
    aug_proportion: {type: float, low: 0.5, high: 1.0}
    aug_level: {type: categorical, choices: ["off", "light", "medium"]}
    attn_queries: {type: categorical, choices: [4, 6, 8, 10]}
    sampler_participation: {type: float, low: 0.5, high: 1.0}
    dropout: {type: float, low: 0.10, high: 0.45}
    lambda_gap: {type: float, low: 0.5, high: 1.5}
