name: dinov3-vitb16-p100-v5
description: |
  DINOv3 ViT-B/16 (86M) v5 — same 3-axis search space as v4 but :
  - val_split_strategy = test_pmf → P_val ≈ P_test, donc le quantile matching post-train est
    enfin meaningfully évaluable (gated dans train.py: désormais skipped si stratified_yg).
  - sampler_strategy=test_pmf retiré du search space (P_val matche déjà test, le sampler de
    training peut rester sur les autres axes sans double correction).
  - 2x P100 16GB (FP16). Backbone iBOT le plus avancé pin via init_backbone_from.
  Étude Optuna distincte de v4 → ne pollue pas le sweep en cours sur 3090.

model:
  model_name: dinov3_vitb16
  output_dim: 1
  head_dropout: 0.1
  projection_size: null
  output_activation: sigmoid
  # `pretrained` est forcé à True par Optuna via le mapping pretrained_source
  # (cf. _apply_trial_param) — pas la peine de le dupliquer ici.
  pooling_type: attention_k_query
  # Attention K-query
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  # Multi-head
  num_heads: 4
  # GeM
  gem_p_init: 3.0
  # Common pool
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0
  # Pretrain pinné sur le snapshot iBOT le plus avancé (v4 run, encoder final).
  init_backbone_from: runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null

training:
  # P100 16GB FP16 : BS=16 par GPU × 2 GPUs × grad_accum=2 = 64 effectif (= v4 sur 3090)
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 2
  num_train_epochs: 8
  learning_rate: 5.0e-05
  weight_decay: 0.05
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 50
  metric_for_best_model: eval_challenge_score_test_estimated
  # v5 : val resamplé pour P_val = P_test → quantile matching meaningful, _test_estimated
  # se confond avec _val. Variance estimateur réduite, lecture intuitive.
  val_split_strategy: test_pmf
  greater_is_better: false
  # Pascal n'a PAS de BF16 → FP16 only
  bf16: false
  fp16: true
  gradient_checkpointing: false
  augmentation_level: medium
  loss_type: weighted_mse
  loss_focal_gamma: 0.0
  loss_fairness_lambda: 1.0
  loss_query_diversity_lambda: 0.0
  eval_importance_reweight: true
  save_qualitative_k: 10
  group_dro_alpha: 0.5
  ema_decay: 0.9995
  ema_warmup_steps: 200
  layer_decay: 0.85

optuna:
  n_trials: 200
  objective_mode: score
  rotate_val_seed: true
  search_space:
    # v5 : pretrained_source PAS dans le search_space (pinné en static sur l'iBOT final
    # via model.init_backbone_from). Économise le budget Optuna pour les vraies questions
    # (équilibrage, pooling, hparams) maintenant que le pretrain "le plus avancé" est connu.
    pooling_type:
      type: categorical
      choices: [cls, gem, attention_k_query, multihead_attention]
    # === Stratégies d'équilibrage v4 — décomposées sur 3 axes orthogonaux ===
    # Voir README §"Stratégies d'équilibrage — 3 axes" pour la matrice complète.
    #   Axe 1 (sampler)       : équilibrage data-level
    #   Axe 2 (loss reweight) : reweighting dans la loss
    #   Axe 3 (feature fair)  : invariance genre au niveau features
    sampler_strategy:
      type: categorical
      # NOTE v5 : test_pmf retiré ici. P_val matche déjà P_test au niveau split, donc on garde
      # les samplers data-level pour leur équilibrage F/M ou Y, pas pour le shift train→test.
      choices:
        - "none"
        - "gender"
        - "occlusion"
        - "gender_x_occ"
    loss_rw_strategy:
      type: categorical
      choices:
        - "none"
        - "imp_rw"
        - "cell_joint"
      # Quand sampler=test_pmf, le loss reweight n'a pas de sens (test_pmf corrige
      # déjà le shift Y au niveau data) → forcer le default "none" (skip sampling).
      # Quand loss_type=group_dro, le reweight n'est pas appliqué non plus (group_dro
      # n'utilise pas importance_reweight / cell_reweight) → skip aussi.
      conditional_on:
        sampler_strategy: ["none", "gender", "occlusion", "gender_x_occ"]
        loss_type: weighted_mse
    feature_fairness:
      type: categorical
      choices:
        - "none"
        - "dann"
        - "mmd"
        - "mixup_gender"
    learning_rate:
      type: float
      low: 1.0e-05
      high: 2.0e-04
      log: true
    weight_decay:
      type: float
      low: 0.0
      high: 0.3
    num_train_epochs:
      type: int
      low: 8
      high: 15
    warmup_ratio:
      type: float
      low: 0.05
      high: 0.2
    head_dropout:
      type: float
      low: 0.0
      high: 0.3
    augmentation_level:
      type: categorical
      choices: [none, light, medium, strong]
    loss_type:
      type: categorical
      choices: [weighted_mse, group_dro]
    # Only sampled when loss_type=weighted_mse (group_dro ignores fairness_lambda + focal_gamma).
    loss_fairness_lambda:
      type: float
      low: 0.0
      high: 2.0
      conditional_on:
        loss_type: weighted_mse
    loss_focal_gamma:
      type: float
      low: 0.0
      high: 2.0
      conditional_on:
        loss_type: weighted_mse
    # Only sampled when loss_type=group_dro.
    group_dro_alpha:
      type: float
      low: 0.1
      high: 1.0
      conditional_on:
        loss_type: group_dro
    layer_decay:
      type: float
      low: 0.65
      high: 1.0
    backbone_drop_path_rate:
      type: float
      low: 0.0
      high: 0.2

    # === Conditional on pooling_type ∈ {attention_k_query, multihead_attention} ===
    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: [attention_k_query, multihead_attention]
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: [attention_k_query, multihead_attention]

    # === Conditional on pooling_type == attention_k_query ===
    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      low: 0.05
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      low: 1.0
      high: 3.0
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      low: 1
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      low: 0
      high: 3
      conditional_on:
        pooling_type: attention_k_query

    # === Conditional on pooling_type == multihead_attention ===
    num_heads:
      type: categorical
      # Divisors common to ViT-B (768) / ViT-L (1024) / ViT-H+ (1280) — keeps search space
      # portable across backbones without arch-specific yaml duplication.
      choices: [2, 4, 8, 16]
      conditional_on:
        pooling_type: multihead_attention

    # === Conditional on feature_fairness (axe 3) — adv_lambda/mmd_lambda/mixup_alpha ===
    adv_lambda:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: dann
    mmd_lambda:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: mmd
    mixup_alpha:
      type: float
      low: 0.1
      high: 0.5
      conditional_on:
        feature_fairness: mixup_gender
