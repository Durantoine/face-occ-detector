name: dinov3-vitb16-3090-v19
description: |
  DINOv3 ViT-B/16 (86M) — primary transformer baseline. Native 224, LVD-1689M pretrain
  (also supports iBOT-finetuned encoder via pretrained_source HPO).

  v19 HPO refinements (informed by mlflow.db trial analysis):
    - loss_focal_gamma [0.5, 2.0] (v4: ρ=-0.50 p=0.006 — higher gamma wins consistently)
    - weight_decay [0.08, 0.40] (top cluster [0.10, 0.30] across v4+v10/11+v17)
    - pool dropouts capped at 0.15 (v10/v11: all top trials use 0.0)
    - adv_lambda [0.005, 0.20] log (DANN top-8 geo-mean 0.064 vs bot-8 0.014)
  Other v19 features: K-query bottleneck (W_OUT), grid pool MLP head, per-gender cal
  artifacts, ensemble script, tau softmax fp32 (small-tau bf16 overflow guard).

model:
  model_name: dinov3_vitb16
  output_dim: 1
  head_dropout: 0.1
  projection_size: null
  output_activation: sigmoid
  pooling_type: attention_k_query   # v16: cls retiré (perd info spatiale)
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  mil_agg: multi
  mil_hidden: 128
  mil_k_top: 30
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null
  # Tri-split v12: train iid 80% / val iid 15% (stratified IS metric) / test holdout 5%
  # (match P_test via H_C) — see docs/v12_theory.md §3 for rationale.
  val_split_ratio: 0.15
  test_split_ratio: 0.05

training:
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 256
  gradient_accumulation_steps: 1
  num_train_epochs: 13   # PINNED v16 (was HPO [7,13]). Rationale: decouple from LR shape;
                          # rely on early_stopping_patience=3 for actual duration.
  learning_rate: 5.0e-05
  weight_decay: 0.10
  warmup_ratio: 0.1
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.3   # HPO override via top-level `min_lr_rate` in training section (see below)
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 25
  metric_for_best_model: eval_challenge_score
  greater_is_better: false
  bf16: true
  fp16: false
  gradient_checkpointing: false
  augmentation_level: none
  layer_decay: 0.85
  # v17 Lagrangien per-epoch sur val_err_diff (signal CLEAN 15k samples).
  # Δλ = lr · (val_err_diff − threshold), clip in [λ_min, λ_max].
  # λ_metric=1 toujours utilisé en eval (challenge metric inchangée).
  loss_lambda_init: 1.0
  loss_lambda_lr: 0.2            # log-space gain on log(val_err_diff/threshold)
  loss_lambda_max: 3.0            # marge haute, log() sature naturellement
  loss_lambda_min: 1.0            # >= poids metrique (toujours pousser fairness)
  loss_lambda_threshold: 0.0005   # zone equilibre
  adv_lambda: 0.01
  ot_lambda: 0.1
  save_qualitative_k: 10

optuna:
  n_trials: 100
  objective_mode: score
  rotate_val_seed: false   # v16 (was true): fix seed so all trials see SAME val split.
                            # Enables ensemble + isotonic on common val without retraining.
                            # Variance protection via large val (15k) + stratified IS + test holdout.
  keep_top_n: 3
  search_space:
    pretrained_source:
      type: categorical
      choices:
        - "lvd"
        - "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder"
    pooling_type:
      type: categorical
      choices: [attention_k_query, mil, grid]   # v16: cls retiré (perd info spatiale)

    # v16: single-axis under H_C — α=correction_strength controls how much we
    # interpolate from P_train(g, y) toward P_test_joint(g, y) = P_train(g|y)·P_test(y).
    # Loss-only (no sampler in v16: with ~41 F per batch=128, fairness mechanisms
    # and gradient variance are fine without oversampling).
    correction_strength: {type: float, low: 0.4, high: 1.0}    # v19: data shows fairness wins concentrate in [0.6, 0.9]; 0.4 = comfortable lower margin

    feature_fairness:
      type: categorical
      choices: [none, ot, dann]
    ot_lambda:
      type: float
      low: 0.03   # v19: mlflow.db OT trials (n=29) top cluster med 0.11; rare wins outside [0.03, 0.5]
      high: 0.5
      log: true
      conditional_on:
        feature_fairness: ot
    adv_lambda:
      type: float
      low: 0.005   # v19: mlflow.db DANN analysis (n=24): TOP-8 geo-mean 0.064, BOT-8 0.014
      high: 0.20   # → shift right (was [0.001, 0.05]; current top sweet spot ~[0.01, 0.1])
      log: true
      conditional_on:
        feature_fairness: dann
    # OT method: 'sliced' (fast, L=100 projections) ou 'sinkhorn' (entropic OT, plus précis ~3x lent)
    ot_method:
      type: categorical
      choices: [sliced, sinkhorn]
      conditional_on:
        feature_fairness: ot
    sinkhorn_eps:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: ot
        ot_method: sinkhorn

    loss_focal_gamma: {type: float, low: 0.5, high: 2.0}   # v19: mlflow.db v4 (ρ=-0.50, p=0.006) — higher gamma = better; was [0.0, 1.5]

    # LR + LLRD ranges informed by v11 trials analysis:
    # - Sweet spot: LR ∈ [1e-4, 2.1e-4] with layer_decay ∈ [0.75, 0.87]
    # - Hence: cap LR at 2e-4 AND layer_decay at 0.9 (was 1.0)
    learning_rate: {type: float, low: 2.0e-05, high: 1.5e-04, log: true}   # v19: v17 data top cluster [1.1e-4, 1.8e-4] → bump high de 1e-4 à 1.5e-4
    # num_train_epochs PINNED at 13 (max), early_stopping_patience=3 decides real duration.
    # LR scheduler shape decoupled via min_lr_rate HPO.
    min_lr_rate:   {type: float, low: 0.2, high: 0.4}   # v19: mlflow.db top-25% [0.23, 0.47] med 0.29
    weight_decay:  {type: float, low: 0.08, high: 0.40}   # v19: top cluster [0.10, 0.30] across v4+v10/11+v17 (ρ=-0.56 on v17)
    head_dropout:  {type: float, low: 0.0, high: 0.4}
    backbone_drop_path_rate: {type: float, low: 0.0, high: 0.4}
    layer_decay:   {type: float, low: 0.65, high: 0.9}

    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.15   # v19: mlflow.db v10+v11 — ALL top trials use 0.0; tighten ceiling
      conditional_on:
        pooling_type: attention_k_query
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.15   # v19: same as above
      conditional_on:
        pooling_type: attention_k_query

    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      low: 0.03   # was 0.05; allow sharper attention (1-2 patches). bf16 safe limit
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      low: 1.0   # v19: mlflow.db top-10 cluster [1.9, 2.9], <1.5 is bot-biased
      high: 3.5   # slight margin above top cluster (one outlier at 3.85)
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 2
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      low: 0   # was 1; allow no diffuse queries (pure focal+free config)
      high: 2
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      low: 0
      high: 2
      conditional_on:
        pooling_type: attention_k_query


    # === MIL pooling (Multi-Instance Learning) ===
    # mil_agg pinned to "multi" (concat of mean+max+topk+gated_attn) — no HPO since
    # multi includes all 4 single-agg modes via its (B, 4) feature passed to head.
    mil_hidden:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: mil
    mil_k_top:
      type: int
      low: 10
      high: 50
      conditional_on:
        pooling_type: mil

    # Grid pooling : régions spatiales 2x2 ou 3x3
    grid_size:
      type: categorical
      choices: [3, 4, 5, 6, 7]   # 7 utile pour ViT (14x14 → cells 2x2 patches)
      conditional_on:
        pooling_type: grid
    # v19 per-query bottleneck (Linear D -> P shared across queries). None = no bottleneck.
    pool_proj_out_dim:
      type: categorical
      choices: ['none', 32, 64, 128]
      conditional_on:
        pooling_type: attention_k_query

    # v19 per-cell bottleneck (Linear D -> P shared across cells) — required for big backbones
    grid_cell_proj_dim:
      type: categorical
      choices: ['none', 32, 64, 128]
      conditional_on:
        pooling_type: grid
    # v19 MLP head (recommended with grid since grid pool has no non-linearity)
    head_type:
      type: categorical
      choices: [linear, mlp]
      conditional_on:
        pooling_type: grid
    head_hidden_dim:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: grid
        head_type: mlp

