name: efficientnet-b0-3090-v16
description: |
  EfficientNet-B0 (CNN ~5M params, native 224×224) — v16. Pivoté de B5 à B0 :
  B0 natif 224 = pas de hack `image_size`, batch 128 OK, 5M params suffit pour
  une tâche de détection localisée (lunettes, masques) sur 80k samples.

  Tricks (Lagrangien désactivé en v16, fairness, IS reweight, focal) conservés
  comme sur les ViT mais avec fixes CNN-spécifiques :
    - GAP ajouté aux pooling choices (head natif CNN, préserve alignement pretrained)
    - mil_agg pinned à "multi" (concat 4 aggs, pas de HPO redondant)
    - head_dropout default 0.2 (native B0 dropout est 0.2, B5 c'est 0.4)
    - layer_decay disabled (LLRD ill-defined sur MBConv)
    - fp16 au lieu de bf16 (CNN + BatchNorm plus stable en fp16)
    - LR cap 1e-4 + WD tighter (CNN sous-régularise vite à WD haut)
    - Lagrangien désactivé (λ pinned à 1.0)

model:
  model_name: tf_efficientnet_b0
  output_dim: 1
  head_dropout: 0.2              # native B0 dropout (B5 was 0.4, B0 lower)
  projection_size: null
  output_activation: sigmoid
  pooling_type: attention_k_query   # default (HPO can try mil)
  # image_size: omitted → default 224 (B0 native)
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  mil_agg: multi
  mil_hidden: 128
  mil_k_top: 30
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null
  val_split_ratio: 0.15
  test_split_ratio: 0.05

training:
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 256
  gradient_accumulation_steps: 1
  num_train_epochs: 13
  learning_rate: 5.0e-05
  weight_decay: 0.05
  warmup_ratio: 0.1
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.3
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 25
  metric_for_best_model: eval_challenge_score
  greater_is_better: false
  bf16: false
  fp16: true                  # fp16 plus stable que bf16 sur CNN (BN précision)
  gradient_checkpointing: false
  augmentation_level: none
  layer_decay: 1.0            # disabled (LLRD ill-defined on MBConv stages)
  ema_decay: 0.999
  # Lagrangien adaptatif : λ peut monter ET descendre via threshold (fix v14).
  loss_lambda_init: 1.0
  loss_lambda_lr: 0.5
  loss_lambda_max: 3.0   # v16: capped at 3 (was 5). Less divergence from metric (λ_metric=1).
  loss_lambda_ema: 0.9
  loss_lambda_threshold: 0.0005
  adv_lambda: 0.01
  ot_lambda: 0.1
  save_qualitative_k: 10

optuna:
  n_trials: 100
  objective_mode: score
  rotate_val_seed: false
  keep_top_n: 3
  search_space:
    pooling_type:
      type: categorical
      choices: [attention_k_query, mil, grid]   # v16: +grid (régions spatiales, head linear simple)

    # v16: single-axis correction under H_C
    correction_strength: {type: float, low: 0.0, high: 1.0}

    feature_fairness:
      type: categorical
      choices: [ot, dann]
    ot_lambda:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: ot
    adv_lambda:
      type: float
      low: 0.001
      high: 0.05
      log: true
      conditional_on:
        feature_fairness: dann
    ot_method:
      type: categorical
      choices: [sliced, sinkhorn]
      conditional_on:
        feature_fairness: ot
    sinkhorn_eps:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: ot
        ot_method: sinkhorn

    loss_focal_gamma: {type: float, low: 0.0, high: 1.5}

    # v16 EfficientNet HPO refinements:
    # - LR cap 1e-4 (CNN converges with lower LR than ViTs)
    # - WD range [0.01, 0.20] (CNN underfits with high WD)
    # - backbone_drop_path_rate REMOVED (timm tf_efficientnet_b0 ignores it)
    # - layer_decay REMOVED (LLRD ill-defined on MBConv)
    learning_rate: {type: float, low: 1.0e-05, high: 1.0e-04, log: true}
    min_lr_rate:   {type: float, low: 0.1, high: 0.5}
    weight_decay:  {type: float, low: 0.01, high: 0.20}
    head_dropout:  {type: float, low: 0.1, high: 0.4}   # B0 native 0.2, range autour

    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: attention_k_query
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.3
      conditional_on:
        pooling_type: attention_k_query

    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      low: 0.03
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      low: 0.5
      high: 3.0
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      low: 0
      high: 4
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      low: 0
      high: 3
      conditional_on:
        pooling_type: attention_k_query

    # MIL pooling: mil_agg pinned to "multi", no HPO needed.
    mil_hidden:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: mil
    mil_k_top:
      type: int
      low: 10
      high: 50
      conditional_on:
        pooling_type: mil

    grid_size:
      type: categorical
      choices: [3, 4, 5, 6]
      conditional_on:
        pooling_type: grid
