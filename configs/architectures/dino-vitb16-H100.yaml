name: dino-vitb16-H100
description: |
  DINOv3 ViT-B/16 (dinov3_vitb16, ~86M) on a single H100 (80GB). v38 pipeline: IS-stratified eval/selection
  on the INTERMEDIATE target P_target=(1-eval_alpha)*P_train+eval_alpha*P_test (eval_alpha=0.3), same alpha
  reweighting sampler+loss; gender-balanced BATCH sampler; fixed fairness lambda + val-tilted asymmetry.
  HEAVILY regularized Optuna ranges (small data + scarce tail). 15 epochs. Pretraining searched:
  DINOv3 LVD weights vs the iBOT ViT-B encoder (c1e1ba1a).

model:
  backbone: dinov3_vitb16
  pooling_type: attention
  grid_size: 4            # GridPool ADAPTIVE-pool output (4x4) -> pooled_dim=d*16; NOT the patch grid (14 -> 150k-dim head -> OOM)
  drop_path: 0.20
  head_dropout: 0.1
  head_mlp_ratio: 0.5     # regularized MLP head: Linear(D->D/2)->GELU->Dropout->Linear

data:
  data_csv: data/raw/train.csv
  remove_csv: data/raw/manual_removals.csv
  image_dir: data/raw
  test_csv: data/raw/test_students.csv
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  val_ratio: 0.15
  val_mode: ptrain_strat  # stratified PROPORTIONAL: exact per-stratum counts (lower variance than random)
  aug_csv: "data/aug/synthetic_all.csv"
  aug_image_dir: data/aug
  aug_proportion: 0.0
  aug_level: medium       # on-the-fly aug (off|light|medium); per-sample intensity scaled by importance w

training:
  epochs: 15
  batch_size: 256        # dinov3_vitb16 + torch.compile: 512 OOMs on 80GB; 256 is safe
  lr: 5.0e-05
  sampler_mode: group_batch
  weight_decay: 0.05
  layer_decay: 0.9
  warmup_ratio: 0.1
  sampler_participation: 1.0
  is_target: joint        # default; searched below
  is_lambda: 0.10
  eval_alpha: 0.3         # linear intermediate P_target=(1-a)P_train+a*P_test (0.3 = closer to P_train, test)
  lambda_gap: 1.0         # FIXED at 1.0 (adaptive lambda retired in v38)
  gap_asymmetric: true    # v38: penalty leans toward the val-worse gender (M); lambda stays fixed
  early_stop_patience: 4
  seed: 123               # v38: new val split (does not reuse v37 seed 42)
  rotate_seed: true       # v38: per-trial seed -> diverse top-K trials for the final ensemble
  bf16: true
  num_workers: 16
  save_qualitative_k: 20
  out_dir: results

optuna:
  n_trials: 80
  search_space:
    pretrained_source: {type: categorical, choices: ["lvd", "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder", "ibot:runs:/c1e1ba1a747747688e3691daa4f7a31a/encoder_100000"]}
    is_target: {type: categorical, choices: [hc, joint]}
    # HEAVILY regularized ranges (small data + scarce high-occ tail).
    lr: {type: float, low: 2.0e-05, high: 6.0e-05}
    weight_decay: {type: float, low: 0.15, high: 0.40}
    layer_decay: {type: float, low: 0.85, high: 0.95}
    drop_path: {type: float, low: 0.15, high: 0.40}
    aug_proportion: {type: float, low: 0.4, high: 1.0}
    aug_level: {type: categorical, choices: ["off", "light", "medium"]}
    attn_queries: {type: categorical, choices: [2, 4, 8]}
    pooling_type: {type: categorical, choices: [attention, grid]}
    sampler_participation: {type: float, low: 0.3, high: 1.0}
    dropout: {type: float, low: 0.15, high: 0.40}
    lambda_gap: {type: float, low: 0.5, high: 1}
