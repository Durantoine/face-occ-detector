name: sapiens2-08b-a100-v19
description: |
  Sapiens2-0.8B (D=1280, ~840M params) — A100 variant of sapiens2-08b-3090-v19.
  Larger batch / fewer accumulation steps to leverage A100 80GB.
  v19 HPO same as 3090 variant.

model:
  model_name: sapiens2_0.8b
  output_dim: 1
  head_dropout: 0.1
  projection_size: null
  output_activation: sigmoid
  pooling_type: attention_k_query   # v16: cls retiré
  n_focal: 2
  n_diffuse: 2
  n_free: 2
  tau_focal_init: 0.1
  tau_diffuse_init: 1.5
  tau_free_init: 1.0
  learnable_tau: true
  mil_agg: multi
  mil_hidden: 128
  mil_k_top: 30
  pool_attn_dropout: 0.0
  pool_proj_dropout: 0.0
  backbone_drop_path_rate: 0.0

data:
  image_col: filename
  label_col: FaceOcclusion
  gender_col: gender
  image_base_dir: data/raw
  data_csv: data/raw/train.csv
  extra_train_csv: null
  val_split_ratio: 0.15
  test_split_ratio: 0.05

training:
  per_device_train_batch_size: 64    # A100 80GB ample, pas besoin de petit batch
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 1    # 1xA100 no DDP, batch=64 effectif
  num_train_epochs: 13   # PINNED v16 (was HPO). Early stopping decides real duration.
  learning_rate: 5.0e-05
  weight_decay: 0.10
  warmup_ratio: 0.1
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.3   # HPO override via top-level `min_lr_rate` (see search_space)
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  logging_steps: 25
  metric_for_best_model: eval_challenge_score
  greater_is_better: false
  bf16: true
  fp16: false
  gradient_checkpointing: false  # A100 80GB n'a pas besoin
  augmentation_level: none
  layer_decay: 0.85
  # v17 Lagrangien per-epoch sur val_err_diff (signal CLEAN 15k samples).
  loss_lambda_init: 1.0
  loss_lambda_lr: 0.2            # log-space gain on log(val_err_diff/threshold)
  loss_lambda_max: 3.0            # marge haute, log() sature naturellement
  loss_lambda_min: 1.0            # >= poids metrique (toujours pousser fairness)
  loss_lambda_threshold: 0.0005   # zone equilibre
  adv_lambda: 0.01
  ot_lambda: 0.1
  save_qualitative_k: 10

optuna:
  n_trials: 100
  objective_mode: score
  rotate_val_seed: false   # v16 (was true): fix seed for ensemble + isotonic on common val.
  keep_top_n: 3
  search_space:
    pretrained_source:
      type: categorical
      choices:
        - "sapiens_default"
        # Replace placeholder with cluster MLflow run_id of pretrain_ibot_sapiens2_08b_2x3090.sh.
        - "ibot:runs:/__FILL_SAPIENS_08B_IBOT_RUN_ID__/encoder"
    pooling_type:
      type: categorical
      choices: [attention_k_query, mil, grid]   # v16: cls retiré

    # v16: single-axis correction under H_C (see docs/v16_theory.md §1)
    correction_strength: {type: float, low: 0.4, high: 1.0}    # v19: data shows fairness wins concentrate in [0.6, 0.9]; 0.4 = comfortable lower margin

    feature_fairness:
      type: categorical
      choices: [none, ot, dann]
    ot_lambda:
      type: float
      low: 0.03   # v19: mlflow.db OT trials (n=29) top med 0.11; rare wins outside [0.03, 0.5]
      high: 0.5
      log: true
      conditional_on:
        feature_fairness: ot
    adv_lambda:
      type: float
      low: 0.005   # v19: mlflow.db DANN analysis (n=24): TOP-8 geo-mean 0.064, BOT-8 0.014
      high: 0.20   # → shift right (was [0.001, 0.05])
      log: true
      conditional_on:
        feature_fairness: dann
    ot_method:
      type: categorical
      choices: [sliced, sinkhorn]
      conditional_on:
        feature_fairness: ot
    sinkhorn_eps:
      type: float
      low: 0.01
      high: 1.0
      log: true
      conditional_on:
        feature_fairness: ot
        ot_method: sinkhorn

    loss_focal_gamma: {type: float, low: 0.5, high: 2.0}   # v19: mlflow.db v4 (ρ=-0.50, p=0.006) — higher gamma = better

    # LR cap 2e-4 + layer_decay cap 0.9 (v11 trials sweet spot).
    learning_rate: {type: float, low: 1.0e-05, high: 1.0e-04, log: true}
    # num_train_epochs PINNED at 13, early_stopping_patience=3 decides real duration.
    min_lr_rate:   {type: float, low: 0.2, high: 0.4}   # v19: mlflow.db top-25% [0.23, 0.47] med 0.29
    weight_decay:  {type: float, low: 0.08, high: 0.40}   # v19: top cluster [0.10, 0.30] across all sources
    head_dropout:  {type: float, low: 0.0, high: 0.4}
    backbone_drop_path_rate: {type: float, low: 0.0, high: 0.4}
    layer_decay:   {type: float, low: 0.65, high: 0.9}

    pool_attn_dropout:
      type: float
      low: 0.0
      high: 0.15   # v19: mlflow.db v10+v11 — ALL top trials use 0.0
      conditional_on:
        pooling_type: attention_k_query
    pool_proj_dropout:
      type: float
      low: 0.0
      high: 0.15   # v19: same
      conditional_on:
        pooling_type: attention_k_query

    loss_query_diversity_lambda:
      type: float
      low: 0.0
      high: 0.2
      conditional_on:
        pooling_type: attention_k_query
    tau_focal_init:
      type: float
      low: 0.03   # was 0.05; allow sharper attention (1-2 patches). bf16 safe limit
      high: 0.3
      log: true
      conditional_on:
        pooling_type: attention_k_query
    tau_diffuse_init:
      type: float
      low: 1.0   # v19: mlflow.db top-10 cluster [1.9, 2.9], <1.5 is bot-biased
      high: 3.5   # slight margin above top cluster
      conditional_on:
        pooling_type: attention_k_query
    n_focal:
      type: int
      low: 1
      high: 2
      conditional_on:
        pooling_type: attention_k_query
    n_diffuse:
      type: int
      low: 0   # was 1; allow no diffuse queries (pure focal+free config)
      high: 2
      conditional_on:
        pooling_type: attention_k_query
    n_free:
      type: int
      low: 0
      high: 2
      conditional_on:
        pooling_type: attention_k_query

    # MIL pooling: mil_agg pinned to "multi" (concat 4 aggs), no HPO needed.
    mil_hidden:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: mil
    mil_k_top:
      type: int
      low: 10
      high: 50
      conditional_on:
        pooling_type: mil

    grid_size:
      type: categorical
      choices: [3, 4, 5, 6, 7]   # 7 utile pour ViT (14x14)
      conditional_on:
        pooling_type: grid
    # v19 per-query bottleneck (Linear D -> P shared across queries). None = no bottleneck.
    pool_proj_out_dim:
      type: categorical
      choices: ['none', 32, 64, 128]
      conditional_on:
        pooling_type: attention_k_query

    # v19 per-cell bottleneck (Linear D -> P shared across cells) — required for big backbones
    grid_cell_proj_dim:
      type: categorical
      choices: ['none', 32, 64, 128]
      conditional_on:
        pooling_type: grid
    # v19 MLP head (recommended with grid since grid pool has no non-linearity)
    head_type:
      type: categorical
      choices: [linear, mlp]
      conditional_on:
        pooling_type: grid
    head_hidden_dim:
      type: categorical
      choices: [64, 128, 256]
      conditional_on:
        pooling_type: grid
        head_type: mlp

